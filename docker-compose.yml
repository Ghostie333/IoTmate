services:
  mqtt:
    image: "eclipse-mosquitto:2"
    container_name: "iotmate-mqtt"
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - "./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
      - "mosquitto_data:/mosquitto/data"
      - "mosquitto_log:/mosquitto/log"

  postgres:
    image: "postgres:16-alpine"
    container_name: "iotmate-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"

  backend:
    build:
      context: "."
    container_name: "iotmate-backend"
    user: "0:0"
    depends_on:
      - mqtt
      - mongo
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      MongoDb__ConnectionString: "mongodb://${MONGO_APP_USER}:${MONGO_APP_PASS}@mongo:27017/${MONGO_DB}?authSource=${MONGO_AUTH_SOURCE}"
    ports:
      - "7070:8080"
    volumes:
      - "backend_data:/app/data"
    restart: unless-stopped

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
  backend_data:
