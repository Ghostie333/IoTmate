# Standard MQTT listener
# listener 1883
listener 8883

allow_anonymous false

# Let's Encrypt certs broker domain
certfile /etc/letsencrypt/live/mqtt.twojadomena.pl/fullchain.pem
keyfile  /etc/letsencrypt/live/mqtt.twojadomena.pl/privkey.pem

# go-auth plugin
plugin /mosquitto/go-auth.so

# Set backend to HTTP
auth_opt_backends http

# HTTP Backend Settings
auth_opt_http_host iotmate-backend
auth_opt_http_port 8080
auth_opt_http_method POST

# Endpoint URIs
auth_opt_http_getuser_uri /api/mqtt/auth/user
auth_opt_http_aclcheck_uri /api/mqtt/auth/acl

# Enable Superuser check via HTTP header or status
auth_opt_http_superuser_mode header

# Form parameter mapping
auth_opt_http_params_mode form

# Enable caching
auth_opt_cache true
auth_opt_cache_seconds 300