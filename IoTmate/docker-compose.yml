services:
  mqtt:
    image: "eclipse-mosquitto:2"
    container_name: "iotmate-mqtt"
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - "./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
      - "mosquitto_data:/mosquitto/data"
      - "mosquitto_log:/mosquitto/log"

  mongo:
    image: "mongo:latest"
    container_name: "iotmate-mongo"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS}"
      MONGO_INITDB_DATABASE: "${MONGO_DB}"
      MONGO_DB: "${MONGO_DB}"
      MONGO_APP_USER: "${MONGO_APP_USER}"
      MONGO_APP_PASS: "${MONGO_APP_PASS}"
    ports:
      - "27017:27017"
    volumes:
      - "mongo_data:/data/db"
      - "./mongo/init:/docker-entrypoint-initdb.d:ro"

  backend:
    build:
      context: "."
    container_name: "iotmate-backend"
    user: "0:0"
    depends_on:
      - mqtt
      - mongo
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      MongoDb__ConnectionString: "mongodb://${MONGO_APP_USER}:${MONGO_APP_PASS}@mongo:27017/${MONGO_DB}?authSource=${MONGO_AUTH_SOURCE}"
    ports:
      - "7070:8080"
    volumes:
      - "backend_data:/app/data"
    restart: unless-stopped

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
  backend_data:
